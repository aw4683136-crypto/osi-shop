<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSI Shop | General Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:15px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}.nav{display:flex;gap:12px;align-items:center}.nav a{color:#fff;text-decoration:none}.cart{background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-weight:800}
.hero{padding:65px 7%;background:linear-gradient(135deg,#111,#3b3e45);color:#fff}.hero h1{font-size:clamp(36px,6vw,62px);margin:0 0 12px}.hero p{font-size:19px;color:#ddd;max-width:680px;line-height:1.7}.btn{display:inline-block;background:#fff;color:#111;padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:900}
.wrap{max-width:1180px;margin:auto;padding:42px 20px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}.toolbar input,.toolbar select{max-width:300px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #00000010}.pic{height:240px;background:#eef0f2;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.emoji{font-size:76px}.body{padding:19px}.tag{display:inline-block;background:#eee;padding:5px 9px;border-radius:8px;font-size:12px}.price{font-size:24px;font-weight:900}.old{text-decoration:line-through;color:#999;margin-right:7px}.desc{color:#666;line-height:1.6}.buy{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:900;cursor:pointer}.buy:disabled{opacity:.45;cursor:not-allowed}
.cartpanel{position:fixed;left:18px;bottom:18px;right:18px;max-width:520px;margin:auto;background:#111;color:#fff;padding:15px 18px;border-radius:16px;z-index:20;display:none}.cartrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #444;padding:8px 0}.checkout{background:#fff;color:#111;border:0;padding:11px 16px;border-radius:9px;font-weight:900}
form{background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 30px #00000010;max-width:700px;margin:auto}label{display:block;margin:12px 0 6px;font-weight:700}
footer{background:#111;color:#aaa;text-align:center;padding:28px;margin-top:30px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.toolbar{display:block}.toolbar input,.toolbar select{max-width:none;margin-top:8px}}
@media(max-width:540px){.grid{grid-template-columns:1fr}.hero{padding:50px 20px}}
</style></head>
<body>
<header><div class="logo">OSI SHOP</div><div class="nav"><a href="#products">المنتجات</a><a href="#order">الطلب</a><div class="cart">🛒 <span id="cartCount">0</span></div></div></header>
<section class="hero"><h1>كل اللي محتاجه في مكان واحد.</h1><p>OSI Shop — متجر عام لمنتجات عملية ومميزة. الدفع عند الاستلام.</p><a class="btn" href="#products">تصفح المنتجات</a></section>
<section class="wrap" id="products"><div class="toolbar"><h2>منتجاتنا</h2><input id="search" placeholder="ابحث عن منتج..." oninput="render()"><select id="category" onchange="render()"><option value="">كل الأقسام</option></select></div><div class="grid" id="grid"></div></section>
<section class="wrap" id="order"><h2>إتمام الطلب</h2><form onsubmit="submitOrder(event)"><label>الطلب</label><textarea id="selected" readonly rows="4" placeholder="أضف منتجًا للسلة أولًا"></textarea><label>الاسم</label><input id="customerName" required placeholder="اسم العميل"><label>رقم الهاتف</label><input id="phone" required type="tel" placeholder="01xxxxxxxxx"><label>المحافظة</label><input id="governorate" required placeholder="المحافظة"><label>العنوان</label><textarea id="address" required rows="3" placeholder="العنوان بالتفصيل"></textarea><button class="buy" type="submit">تأكيد الطلب عبر واتساب</button><p id="msg"></p></form></section>
<div class="cartpanel" id="cartPanel"><strong>السلة</strong><div id="cartItems"></div><button class="checkout" onclick="goOrder()">إتمام الطلب</button></div>
<footer>© 2026 OSI Shop — General Store</footer>
<script src="products.js"></script>
<script>
let cart=[];const WHATSAPP_NUMBER="201000000000";
function money(n){return Number(n).toLocaleString("ar-EG")+" جنيه"}
function imageHTML(p){return p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:`<div class="emoji">${p.emoji||"🛍️"}</div>`}
function setupCategories(){let c=[...new Set(PRODUCTS.filter(p=>p.active).map(p=>p.category).filter(Boolean))];document.getElementById("category").innerHTML='<option value="">كل الأقسام</option>'+c.map(x=>`<option>${x}</option>`).join("")}
function render(){let q=document.getElementById("search").value.trim().toLowerCase(),cat=document.getElementById("category").value;let list=PRODUCTS.filter(p=>p.active&&(!cat||p.category===cat)&&(!q||(p.name+" "+p.category+" "+p.description).toLowerCase().includes(q)));document.getElementById("grid").innerHTML=list.map(p=>`<article class="card"><div class="pic">${imageHTML(p)}</div><div class="body"><span class="tag">${p.category||"عام"}</span><h3>${p.name}</h3><p><span class="price">${money(p.price)}</span> ${p.oldPrice?`<span class="old">${money(p.oldPrice)}</span>`:""}</p><p class="desc">${p.description||""}</p><button class="buy" ${p.stock<=0?"disabled":""} onclick="addToCart('${p.id}')">${p.stock>0?"أضف للسلة":"غير متوفر"}</button></div></article>`).join("")||"<p>لا توجد منتجات مطابقة.</p>"}
function addToCart(id){let p=PRODUCTS.find(x=>x.id===id);if(!p||p.stock<=0)return;let r=cart.find(x=>x.id===id);if(r){if(r.qty<p.stock)r.qty++}else cart.push({id,qty:1});updateCart()}
function updateCart(){let q=cart.reduce((s,x)=>s+x.qty,0);document.getElementById("cartCount").textContent=q;document.getElementById("cartPanel").style.display=q?"block":"none";document.getElementById("cartItems").innerHTML=cart.map(x=>{let p=PRODUCTS.find(y=>y.id===x.id);return `<div class="cartrow"><span>${p.name} × ${x.qty}</span><span>${money(p.price*x.qty)}</span></div>`}).join("")}
function goOrder(){document.getElementById("order").scrollIntoView({behavior:"smooth"});document.getElementById("selected").value=cart.map(x=>{let p=PRODUCTS.find(y=>y.id===x.id);return `${p.name} × ${x.qty} — ${money(p.price*x.qty)}`}).join("\n")}
function submitOrder(e){e.preventDefault();if(!cart.length){document.getElementById("msg").textContent="أضف منتجًا للسلة أولًا.";return}let name=document.getElementById("customerName").value,phone=document.getElementById("phone").value,gov=document.getElementById("governorate").value,address=document.getElementById("address").value,lines=cart.map(x=>{let p=PRODUCTS.find(y=>y.id===x.id);return `• ${p.name} × ${x.qty} = ${money(p.price*x.qty)}`}).join("\n"),total=cart.reduce((s,x)=>{let p=PRODUCTS.find(y=>y.id===x.id);return s+p.price*x.qty},0),msg=`طلب جديد من OSI Shop\n\nالاسم: ${name}\nالهاتف: ${phone}\nالمحافظة: ${gov}\nالعنوان: ${address}\n\n${lines}\n\nالإجمالي: ${money(total)}\nالدفع: عند الاستلام`;window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank");document.getElementById("msg").textContent="جاري فتح واتساب لإرسال الطلب ✅"}
setupCategories();render();
</script></body></html>
