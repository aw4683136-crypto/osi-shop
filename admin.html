<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSI Shop Product Builder</title><style>body{font-family:Arial;margin:0;background:#f4f5f7}.wrap{max-width:850px;margin:auto;padding:25px 16px}.card{background:#fff;padding:22px;border-radius:18px;margin-bottom:18px;box-shadow:0 8px 25px #0001}input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}.primary{background:#111;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.item button{float:left}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>OSI Shop — Product Builder</h1><div class="card"><b>إضافة المنتجات بسهولة:</b> اكتب بيانات المنتج ثم اضغط تصدير products.js. ارفع الملف الناتج بدل الملف القديم في GitHub.</div><div class="card"><h2>إضافة منتج</h2><div class="row"><div>اسم المنتج<input id="name"></div><div>التصنيف<input id="category" placeholder="Gadgets"></div></div><div class="row"><div>السعر<input id="price" type="number"></div><div>السعر قبل الخصم<input id="oldPrice" type="number"></div></div><div class="row"><div>رابط الصورة<input id="image" placeholder="https://...jpg"></div><div>Emoji<input id="emoji" placeholder="🛍️"></div></div><div class="row"><div>المخزون<input id="stock" type="number" value="20"></div><div>الوصف<input id="description"></div></div><button class="primary" onclick="add()">إضافة</button><button onclick="exportJS()">تصدير products.js</button><button onclick="clearAll()">مسح</button></div><div class="card"><h2>القائمة</h2><div id="list"></div></div></div><script>let data=JSON.parse(localStorage.getItem("osi_products_v3")||"[]");function render(){document.getElementById("list").innerHTML=data.map((p,i)=>`<div class="item"><b>${p.name}</b> — ${p.price} جنيه<br><small>${p.category} | مخزون: ${p.stock}</small><button onclick="removeP(${i})">حذف</button></div>`).join("")||"<p>لا توجد منتجات.</p>"}function add(){let p={id:"p-"+Date.now(),name:name.value.trim(),category:category.value.trim()||"عام",price:Number(price.value)||0,oldPrice:Number(oldPrice.value)||0,image:image.value.trim(),emoji:emoji.value.trim()||"🛍️",description:description.value.trim(),stock:Number(stock.value)||0,featured:false,active:true};if(!p.name||!p.price){alert("اكتب اسم المنتج والسعر");return}data.push(p);localStorage.setItem("osi_products_v3",JSON.stringify(data));render()}function removeP(i){data.splice(i,1);localStorage.setItem("osi_products_v3",JSON.stringify(data));render()}function clearAll(){if(confirm("متأكد؟")){data=[];localStorage.removeItem("osi_products_v3");render()}}function exportJS(){let c="const PRODUCTS = "+JSON.stringify(data,null,2)+";\n",b=new Blob([c],{type:"text/javascript;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="products.js";a.click()}render()</script></body></html>
